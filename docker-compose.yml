services:

  router:
    image: nginx:alpine
    container_name: devagents-router
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gateway
      - redis
    networks:
      - devagents-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: devagents-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - devagents-net
    restart: unless-stopped


  kafka:
    image: apache/kafka:latest
    container_name: devagents-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - devagents-net
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: devagents-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    networks:
      - devagents-net
    depends_on:
      - kafka


  postgres:
    image: postgres:15-alpine
    container_name: devagents-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: devagents_db
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - devagents-net
    restart: unless-stopped

  mongodb:
    image: mongo:6.0
    container_name: devagents-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: devagents_nosql
    volumes:
      - mongo_data:/data/db
    networks:
      - devagents-net
    restart: unless-stopped


  recsys:
    build:
      context: ./services/recsys
    container_name: devagents-recsys
    ports:
      - "8003:8003"
    environment:
      - MONGO_URL=mongodb://mongodb:27017/devagents_nosql
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    networks:
      - devagents-net
    depends_on:
      - mongodb
      - kafka
    restart: unless-stopped


  ollama:
    image: ollama/ollama:latest
    container_name: devagents-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_storage:/root/.ollama
    networks:
      - devagents-net
    restart: unless-stopped

  gateway:
    build:
      context: ./services/gateway
    container_name: devagents-gateway
    ports:
      - "8000:8000"
    environment:
      - ORCHESTRATOR_URL=http://orchestrator:8001
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    networks:
      - devagents-net
    depends_on:
      - orchestrator
      - redis

  orchestrator:
    build:
      context: ./services/orchestrator
    container_name: devagents-orchestrator
    ports:
      - "8001:8001"
    environment:
      - LANGFUSE_PUBLIC_KEY=pk-lf-e7482024-a3da-46b7-9e54-ff0b4bccec00
      - LANGFUSE_SECRET_KEY=sk-lf-b17c825b-d88a-4437-80b1-0291f2965d12
      - LANGFUSE_HOST=https://cloud.langfuse.com
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POSTGRES_URL=postgresql://devuser:devpassword@postgres:5432/devagents_db
      - MONGO_URL=mongodb://mongodb:27017/devagents_nosql
    volumes:
      - ./agents:/app/agents
      - ./skills:/app/skills
      - ./soul:/app/soul
      - ./memory:/app/memory
    networks:
      - devagents-net
    depends_on:
      - kafka
      - postgres
      - mongodb

  executor:
    build:
      context: ./services/executor
    container_name: devagents-executor
    ports:
      - "8002:8002"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    networks:
      - devagents-net
    restart: unless-stopped

networks:
  devagents-net:
    driver: bridge

volumes:
  ollama_storage:
  redis_data:
  kafka_data:
  postgres_data:
  mongo_data: